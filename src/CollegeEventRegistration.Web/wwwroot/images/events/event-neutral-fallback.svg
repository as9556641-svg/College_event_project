<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C17"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#14C2C6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14C2C6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glowTeal)"/>
  <rect width="800" height="450" fill="url(#glowBlue)"/>
  <g transform="translate(400, 225)" text-anchor="middle">
    <!-- Center Calendar / Academic Icon -->
    <rect x="-36" y="-36" width="72" height="72" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    <path d="M-16 -12 h32 M-16 -2 h24 M-16 8 h16" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="16" cy="8" r="3" fill="#14C2C6"/>
  </g>
</svg>
